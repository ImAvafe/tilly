name: Releases

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main
        uses: actions/checkout@v3

      - name: Remove Rodeo from Rokit tools
        run: sed -i '/^rodeo = /d' rokit.toml

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rokit Toolchains
        run: rokit install

      - name: Install Dependencies
        run: wally install

      - name: Create Packages Directory
        run: mkdir -p Packages

      - name: Build package rbxm
        run: rojo build -o tilly.rbxm default.project.json

      - name: Upload package rbxm as build artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: tilly
          path: tilly.rbxm

      - name: Get Release from wally.toml
        uses: SebRollen/toml-action@v1.0.0
        id: read_toml
        with:
          file: "wally.toml"
          field: "package.version"

      - name: Publish to Wally
        env:
          WALLY_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
        run: |
          mkdir =p ~/.wally
          printf "[tokens]\n\"https://api.wally.run/\" = \"%s\"" "$WALLY_TOKEN" >> ~/.wally/auth.toml
          wally publish

      - name: Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          name: ${{ steps.read_toml.outputs.value }}
          tag_name: ${{ steps.read_toml.outputs.value }}
          files: tilly.rbxm
          generate_release_notes: true
          draft: true
          overwrite_files: false

  development:
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development
        uses: actions/checkout@v3

      - name: Remove Rodeo from Rokit tools
        run: sed -i '/^rodeo = /d' rokit.toml

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rokit Toolchains
        run: rokit install

      - name: Install Dependencies
        run: wally install

      - name: Create Packages Directory
        run: mkdir -p Packages

      - name: Build test-pack.rbxm
        run: rojo build -o test-pack.rbxm default.project.json

      - name: Upload test-pack.rbxm as build artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: tilly
          path: test-pack.rbxm
